[package]
name = "matt-kanban"
version = "0.1.0"
description = "The Board: a read-only view of every Project's Tickets"
edition = "2021"

[lib]
name = "matt_kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the menu-bar extra. macos-private-api: the transparent popover window (rounded corners).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Needed by generate_context! to embed the plugins section of tauri.conf.json.
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# Places the menu-bar popover under the tray icon.
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
